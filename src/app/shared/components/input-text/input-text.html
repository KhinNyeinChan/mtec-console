<div
  class="field"
  [class.field-error]="hasError()"
  [class.field-disabled]="isDisabled()"
>
  @if (label()) {
    <label class="label" [for]="inputId">
      {{ label() | translate }}
      @if (required()) {
        <span class="required" aria-hidden="true">*</span>
      }
    </label>
  }

  <input
    class="control"
    [id]="inputId"
    [type]="type()"
    [name]="name()"
    [placeholder]="placeholder() | translate"
    [required]="required()"
    [disabled]="isDisabled()"
    [attr.autocomplete]="autocomplete()"
    [attr.aria-invalid]="hasError()"
    [attr.aria-describedby]="describedBy()"
    [value]="value()"
    (input)="onInput($event)"
    (blur)="onBlur()"
  />

  @if (hasError()) {
    <p class="hint hint-error" [id]="errorId">{{ error() | translate }}</p>
  } @else if (helperText()) {
    <p class="hint" [id]="helperId">{{ helperText() | translate }}</p>
  }
</div>
