<header class="storefront-header">
  <div class="storefront-header__left">
    <h1 class="app-name">{{ appName() }}</h1>
  </div>

  <div class="storefront-header__right">
    <button
      type="button"
      class="icon-btn"
      [attr.aria-label]="'storefront.notifications' | translate"
      (click)="onNotificationClick()"
    >
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M12 3.5a5.5 5.5 0 0 1 5.5 5.5v2.2c0 .7.2 1.4.6 2l1.2 1.7c.7 1-.1 2.4-1.3 2.4H5.99c-1.2 0-2-1.4-1.3-2.4l1.2-1.7c.4-.6.6-1.3.6-2V9A5.5 5.5 0 0 1 12 3.5Z"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linejoin="round"
        />
        <path
          d="M9.5 18.5a2.5 2.5 0 0 0 5 0"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
        />
      </svg>
    </button>

    @if (userName()) {
      <span class="user-name" [attr.title]="userName()">{{ userName() }}</span>
    }

    <div class="lang-toggle" role="group" [attr.aria-label]="'language.toggle' | translate">
      @for (lang of languages; track lang) {
        <button
          type="button"
          class="lang-btn"
          [class.active]="currentLang() === lang"
          [attr.aria-pressed]="currentLang() === lang"
          (click)="setLanguage(lang)"
        >
          {{ langLabel(lang) }}
        </button>
      }
    </div>
  </div>
</header>
